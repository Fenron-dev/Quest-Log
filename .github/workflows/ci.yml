name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimale Rechte für alle Jobs. Dieser Workflow nutzt keine Secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret-Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  detect:
    name: Projektteile erkennen
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
      server: ${{ steps.check.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          [ -f app/pubspec.yaml ] && echo "app=true" >> "$GITHUB_OUTPUT" || echo "app=false" >> "$GITHUB_OUTPUT"
          [ -f server/go.mod ] && echo "server=true" >> "$GITHUB_OUTPUT" || echo "server=false" >> "$GITHUB_OUTPUT"

  server:
    name: Server testen
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  app-checks:
    name: App prüfen
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter direkt aus dem offiziellen Repository statt über eine Action:
      # subosito/flutter-action referenziert actions/cache per Tag, was die
      # Action-Richtlinie des Repositorys ablehnt.
      - name: Flutter installieren (stable)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
        shell: bash
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android-APK bauen
    needs: [detect, app-checks]
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Flutter direkt aus dem offiziellen Repository statt über eine Action:
      # subosito/flutter-action referenziert actions/cache per Tag, was die
      # Action-Richtlinie des Repositorys ablehnt.
      - name: Flutter installieren (stable)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
        shell: bash
      - run: flutter pub get
      # Debug-Build zum Testen auf dem eigenen Gerät. Signierte Releases kommen
      # später über einen eigenen Workflow mit geschützter Umgebung "release".
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-desktop:
    name: Desktop bauen (${{ matrix.target }})
    needs: [detect, app-checks]
    # Desktop-Builds nur auf main oder per Hand, damit Pull Requests schnell bleiben.
    if: needs.detect.outputs.app == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            output: app/build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            output: app/build/macos/Build/Products/Release
          - target: linux
            os: ubuntu-latest
            output: app/build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux-Abhängigkeiten
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      # Flutter direkt aus dem offiziellen Repository statt über eine Action:
      # subosito/flutter-action referenziert actions/cache per Tag, was die
      # Action-Richtlinie des Repositorys ablehnt.
      - name: Flutter installieren (stable)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
        shell: bash
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.output }}
          retention-days: 7
